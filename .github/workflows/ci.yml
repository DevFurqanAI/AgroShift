name: AgroShift CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend Python & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python syntax and pytest suite
        run: |
          python -m py_compile app/main.py app/rotation/*.py
          python -m pytest -v

  frontend-checks:
    name: Frontend Typecheck, Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vite production build
        run: npm run build

      - name: Run frontend test suite
        run: npx tsx --test tests/agroshift.test.ts
